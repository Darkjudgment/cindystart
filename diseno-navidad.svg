        <line x1="0" y1="-11" x2="4" y2="-15"/>
        <line x1="0" y1="11" x2="-4" y2="15"/>
        <line x1="0" y1="11" x2="4" y2="15"/>
        <line x1="-9.5" y1="-5.5" x2="-14" y2="-6"/>
        <line x1="9.5" y1="5.5" x2="14" y2="6"/>
        <line x1="-9.5" y1="5.5" x2="-14" y2="6"/>
        <line x1="9.5" y1="-5.5" x2="14" y2="-6"/>
