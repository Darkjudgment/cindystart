<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1465" width="900" height="1465">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#a81620"/>
      <stop offset="55%" stop-color="#8a0f1a"/>
      <stop offset="100%" stop-color="#5c0812"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="45%" stop-color="#f7c53a"/>
      <stop offset="100%" stop-color="#d99a15"/>
    </linearGradient>
    <linearGradient id="sweaterG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e8ee"/>
    </linearGradient>
    <linearGradient id="hatRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e02434"/>
      <stop offset="100%" stop-color="#b3121f"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b3a"/>
      <stop offset="100%" stop-color="#101017"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d0ac"/>
      <stop offset="100%" stop-color="#eec096"/>
    </linearGradient>
    <linearGradient id="bowlG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1f6"/>
      <stop offset="100%" stop-color="#c3cad6"/>
